<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musaic</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
  <header>
    <span id="logo">Musaic</span>
    <nav id="main-nav">
      <button id="nav-builder">Builder</button>
      <button id="nav-collection">Collection</button>
    </nav>
  </header>

  <main>
    <!-- BUILDER VIEW -->
    <section id="builder-view">
      <aside id="search-panel">
        <input type="search" autocomplete="off" id="search-bar" placeholder="Search artists, songs, albums...">
        <div id="results-container">
        </div>
      </aside>

      <div id="builder-main">
        <h2 id="mosaic-title" contenteditable="true" data-placeholder="Your Musaic"></h2>
        <div id="grid-size-picker">
          <div id="grid-size-info">
            <span id="grid-size-label">Grid size: </span>
            <span id="grid-size-value">4</span>
          </div>
          <input type="range" id="grid-size-slider" min="2" max="8" value="4" step="1">
        </div>

        <div id="mosaic-grid"></div>

        <div id="mosaic-actions">
          <button class="action-btn" id="fill-gaps-btn">Fill</button>
          <button class="action-btn" id="randomize-covers-btn">Shuffle</button>
          <button class="action-btn" id="export-mosaic-btn">Export</button>
          <button class="action-btn" id="save-mosaic-btn">Save</button>
        </div>
      </div>
    </section>


    <!-- COLLECTION VIEW -->
    <section id="collection-view" class="hidden">
      <h2 id="collection-header">My collection</h2>

      <div id="collection-controls">
        <div id="sort-controls">
          <label for="sort-select">Sort by</label>
          <select name="sort-select" id="sort-select">
            <option value="newest" selected>Newest</option>
            <option value="oldest">Oldest</option>
            <option value="a-z">A-Z</option>
            <option value="z-a">Z-A</option>
          </select>
        </div>

        <div id="filter-controls">
          <div id="completion-filters">
            <label>Show</label>
            <label class="filter-pill">
              <input type="radio" name="completion" value="all" checked>
              All
            </label>
            <label class="filter-pill">
              <input type="radio" name="completion" value="complete">
              Complete
            </label>
            <label class="filter-pill">
              <input type="radio" name="completion" value="incomplete">
              Incomplete
            </label>
          </div>
          <div id="grid-size-filters">
            <label>Grid size</label>
            <label class="filter-pill">
              <input type="checkbox" name="grid-size-filter" value="3">
              3x3
            </label>
            <label class="filter-pill">
              <input type="checkbox" name="grid-size-filter" value="4">
              4x4
            </label>
            <label class="filter-pill">
              <input type="checkbox" name="grid-size-filter" value="6">
              6x6
            </label>
          </div>
        </div>
      </div>

      <div id="collection-grid">
        <button id="new-mosaic-btn">
          <span class="icon">+</span>
          <span>New Musaic</span>
        </button>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
